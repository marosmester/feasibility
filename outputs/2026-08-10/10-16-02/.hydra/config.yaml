simulation:
  _target_: ostrich.SimulationConfig
  duration_seconds: 6.0
  target_timestep_seconds: 0.03
  num_worlds: 1
  use_cuda_graph: true
rendering:
  _target_: ostrich.RenderingConfig
  vis_type: gl
  target_fps: 30
  usd_file: null
  world_offset_x: 5.0
  world_offset_y: 5.0
logging:
  _target_: ostrich.LoggingConfig
engine:
  _target_: ostrich.OstrichEngineConfig
  nr:
    max_iters: 16
    backtrack_min_iter: 4
    atol: 1.0e-05
  linear:
    max_iters: 26
    tol: 0.001
    atol: 0.001
    regularization: 1.0e-06
  compliance:
    joint: 6.0e-10
    contact: 1.0e-10
    friction: 1.0e-08
  contacts:
    max_per_world: 256
    reduction:
      policy: cluster
      max_per_pair: 8
  warm_start:
    enabled: true
  linesearch:
    enabled: false
    conservative_step_count: 16
    conservative_upper_bound: 0.8
    min_step: 1.0e-06
    optimistic_step_count: 48
    optimistic_window: 0.4
control:
  mode: velocity
  k_p: 150.0
  k_d: 0.0
project_name: ${hydra:job.name}
friction_coeff: 0.4
