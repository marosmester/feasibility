# Umbrella project: pins two submodules as one shared .venv in which both are
# importable (`import ostrich`, `import helhest`, and ostrich's `examples.*`, which
# its wheel also packages). Also packages src/feasibility -- small root-level glue
# code (e.g. terrain assets shared between the two repos' demos) that doesn't belong
# inside either submodule.
#
# Deliberately NOT a uv workspace: ostrich/pyproject.toml already declares its own
# `[tool.uv.workspace]` (member third_party/newton), and uv does not support nested
# workspaces -- making this a workspace would mean editing a submodule's manifest and
# carrying a permanent diff against upstream. Editable path deps give the same shared
# env while leaving both trees pristine.
#
# Prerequisite (the newton path below does not exist until this is run):
#     git -C ostrich submodule update --init --recursive
# Then:
#     uv sync           # several GB: torch/cu128 + CUDA wheels; builds openmesh (needs CMake < 4.0)
[project]
name = "feasibility"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ostrich[sim]",
  "helhest-stack[viz,data]",
  # Direct dep only so the index pin below can take effect -- see the torch note in
  # [tool.uv.sources]. Version floor matches ostrich's own.
  "torch>=2.9.1",
  # Pinned exact: the joint resolve otherwise pulls whatever's newest on the nvidia
  # index (drifted to 1.16.0 once); ostrich's own lock tests against 1.14.0.
  "warp-lang==1.14.0",
  # src/feasibility/comparator writes its own HDF5 output (matching ostrich's own
  # logging convention) -- was previously only a transitive dep via ostrich[sim] /
  # helhest-stack[data], now a direct one since feasibility imports h5py itself.
  "h5py>=3.14",
]

[tool.uv]
# Copied from ostrich/pyproject.toml: newton's two CUDA-flavoured extras are mutually
# exclusive and uv needs to be told, or resolution fails.
conflicts = [
  [
    { package = "newton", extra = "torch-cu12" },
    { package = "newton", extra = "torch-cu13" },
  ],
]

# IMPORTANT: `tool.uv.sources` is NOT transitive -- uv honours it only for the project
# being resolved, never for a path dependency's own manifest. So every source that
# ostrich (and newton) rely on internally has to be restated here, or uv resolves those
# names against PyPI instead:
#
#   * newton    -- ostrich declares `newton = { workspace = true }`, meaningless from
#                  here; without the override uv would fetch an unrelated PyPI `newton`.
#   * warp-lang -- ostrich pulls it from the nvidia index.
#   * torch     -- newton's `torch-cu12` extra is what pins torch to the cu128 registry
#                  upstream (ostrich's lock: 2.9.1+cu128). That pin is lost here, hence
#                  the explicit index below plus the direct dependency above.
[tool.uv.sources]
ostrich = { path = "ostrich", editable = true }
helhest-stack = { path = "helhest_stack", editable = true }
newton = { path = "ostrich/third_party/newton", editable = true }
warp-lang = { index = "nvidia" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feasibility"]
